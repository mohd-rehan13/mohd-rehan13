  <text x="733" y="182" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Hands-on</text>
  <text x="733" y="200" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">Practice in safe labs</text>
  <rect x="52" y="220" width="210" height="6" rx="3" fill="url(#accent)"/>
  <rect x="345" y="220" width="210" height="6" rx="3" fill="url(#accent)"/>
